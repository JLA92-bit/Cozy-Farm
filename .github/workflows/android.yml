name: Build Android app (TWA)

# Builds the Google Play app bundle (.aab) for Cozy Acres with Bubblewrap.
# Manual only: Actions > "Build Android app (TWA)" > Run workflow. Never runs on push.
# The website must already be live (https://cozyacres.joshmakesgames.app/play/), because Bubblewrap
# downloads the icons and the web manifest from it. Setup and secrets: android/README.md.

on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: 'versionCode (whole number, must be higher than every bundle already uploaded to Play)'
        required: true
        default: '1'
      versionName:
        description: 'versionName shown to players (empty = the version in package.json)'
        required: false
        default: ''
      uploadToPlay:
        description: 'Also upload to the Play internal testing track as a draft (needs PLAY_SERVICE_ACCOUNT_JSON)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: android-build
  cancel-in-progress: false

env:
  BUBBLEWRAP_VERSION: '1.25.0'
  # Bubblewrap 1.25.0 needs exactly these Android SDK parts (BUILD_TOOLS_VERSION and compileSdkVersion).
  ANDROID_BUILD_TOOLS: '36.1.0'
  ANDROID_PLATFORM: 'android-36'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          if [ "$HAS_KEYSTORE" != "true" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing. See android/README.md."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK parts
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "build-tools;${ANDROID_BUILD_TOOLS}" "platforms;${ANDROID_PLATFORM}"
          # Bubblewrap checks that the SDK folder has a "tools" or "bin" folder (old SDK layout).
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ ! -d "$SDK/tools" ] && [ ! -d "$SDK/bin" ]; then
            ln -s "$(dirname "$(readlink -f "$(command -v sdkmanager)")")" "$SDK/bin"
          fi
          ls "$SDK"

      - name: Install Bubblewrap
        run: npm install -g "@bubblewrap/cli@${BUBBLEWRAP_VERSION}"

      - name: Write Bubblewrap config
        run: |
          mkdir -p "$HOME/.bubblewrap"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          jq -n --arg jdk "$JAVA_HOME" --arg sdk "$SDK" '{jdkPath: $jdk, androidSdkPath: $sdk}' > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"

      - name: Set version in twa-manifest.json
        working-directory: android
        env:
          VERSION_CODE: ${{ inputs.versionCode }}
          VERSION_NAME: ${{ inputs.versionName }}
        run: |
          if ! [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::versionCode must be a whole number above 0, got '$VERSION_CODE'"
            exit 1
          fi
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="$(jq -r .version ../package.json)"
          fi
          # Bubblewrap reads the version name from "appVersion"; "appVersionName" is kept in step.
          jq --argjson code "$VERSION_CODE" --arg name "$VERSION_NAME" \
            '.appVersionCode = $code | .appVersionName = $name | .appVersion = $name' \
            twa-manifest.json > twa-manifest.tmp.json
          mv twa-manifest.tmp.json twa-manifest.json
          jq '{packageId, appVersionCode, appVersionName, appVersion}' twa-manifest.json

      - name: Decode upload keystore
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks
          test -s upload-keystore.jks

      - name: Show upload key fingerprint (for assetlinks.json)
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
        run: |
          keytool -list -v -keystore upload-keystore.jks -alias upload -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" | grep -E 'SHA256:' || true

      - name: Generate the Android project
        working-directory: android
        run: bubblewrap update --skipVersionUpgrade

      - name: Build and sign
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          # "update" above wrote manifest-checksum.txt, so "build" does not stop to ask questions.
          bubblewrap build --skipPwaValidation
          ls -la app-release-bundle.aab app-release-signed.apk

      - name: Remove keystore
        if: always()
        working-directory: android
        run: rm -f upload-keystore.jks

      - uses: actions/upload-artifact@v4
        with:
          name: cozy-acres-android-${{ inputs.versionCode }}
          path: |
            android/app-release-bundle.aab
            android/app-release-signed.apk
            android/twa-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload to Play internal testing (draft)
        if: ${{ inputs.uploadToPlay && env.HAS_PLAY_SA == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.joshmakesgames.cozyacres
          releaseFiles: android/app-release-bundle.aab
          track: internal
          status: draft

      - name: Note about Play upload
        if: ${{ inputs.uploadToPlay && env.HAS_PLAY_SA != 'true' }}
        run: echo "::warning::uploadToPlay was ticked but the PLAY_SERVICE_ACCOUNT_JSON secret is not set, so nothing was uploaded. Download the .aab from this run's artifacts instead."
