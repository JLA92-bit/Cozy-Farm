name: Build Android app

# 1.32 Builds the Google Play app bundle (.aab) for Cozy Acres: the game's files inside a Capacitor app (android/).
# Manual only: Actions > "Build Android app" > Run workflow. Never runs on push. Setup and secrets: android/README.md.
# Every game update needs a new build (and a higher versionCode) for the app; the website still updates on push.

on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: 'versionCode (whole number, must be higher than every bundle already uploaded to Play: 5 or more)'
        required: true
        default: '5'
      versionName:
        description: 'versionName shown to players (empty = the version in package.json)'
        required: false
        default: ''
      uploadToPlay:
        description: 'Also upload to the Play internal testing track as a draft (needs PLAY_SERVICE_ACCOUNT_JSON)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Check inputs and secrets
        env:
          VERSION_CODE: ${{ inputs.versionCode }}
        run: |
          if [ "$HAS_KEYSTORE" != "true" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing. See android/README.md."
            exit 1
          fi
          if ! [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::versionCode must be a whole number above 0, got '$VERSION_CODE'"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install
        run: npm ci

      - name: Build the game for the app and copy it in
        env:
          # the same online play settings as the website (deploy.yml); empty = practice mode
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL || '' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || '' }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY || secrets.VITE_VAPID_PUBLIC_KEY || '' }}
        run: |
          npm run validate-data
          npm run build:app

      - name: Version
        id: version
        env:
          VERSION_NAME: ${{ inputs.versionName }}
        run: |
          if [ -z "$VERSION_NAME" ]; then VERSION_NAME="$(jq -r .version package.json)"; fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "versionCode ${{ inputs.versionCode }}, versionName $VERSION_NAME"

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          test -s "$RUNNER_TEMP/upload-keystore.jks"

      - name: Show upload key fingerprint
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
        run: keytool -list -v -keystore "$RUNNER_TEMP/upload-keystore.jks" -alias upload -storepass "$UPLOAD_KEYSTORE_PASSWORD" | grep -E 'SHA1:|SHA256:' || true

      - name: Build and sign
        working-directory: android
        env:
          UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
          UPLOAD_KEY_ALIAS: upload
        run: |
          ./gradlew --no-daemon bundleRelease assembleRelease \
            -PversionCode=${{ inputs.versionCode }} -PversionName="${{ steps.version.outputs.name }}"
          mkdir -p ../out
          cp app/build/outputs/bundle/release/app-release.aab ../out/cozy-acres-${{ inputs.versionCode }}.aab
          cp app/build/outputs/apk/release/app-release.apk ../out/cozy-acres-${{ inputs.versionCode }}.apk
          ls -la ../out

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: cozy-acres-android-${{ inputs.versionCode }}
          path: out/
          if-no-files-found: error
          retention-days: 30

      - name: Upload to Play internal testing (draft)
        if: ${{ inputs.uploadToPlay && env.HAS_PLAY_SA == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.joshmakesgames.cozyacres
          releaseFiles: out/cozy-acres-${{ inputs.versionCode }}.aab
          track: internal
          status: draft

      - name: Note about Play upload
        if: ${{ inputs.uploadToPlay && env.HAS_PLAY_SA != 'true' }}
        run: echo "::warning::uploadToPlay was ticked but the PLAY_SERVICE_ACCOUNT_JSON secret is not set, so nothing was uploaded. Download the .aab from this run's artifacts instead."
