name: Deploy website and game

# One site, one deploy:
#   https://cozyacres.joshmakesgames.app/        the Cozy Acres website (design/cozy-acres-website)
#   https://cozyacres.joshmakesgames.app/play/   the game
# Hosted on Cloudflare Pages when the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are set
# (CLOUDFLARE.md): GitHub builds the site and uploads only the finished files, so the repository can be private.
# Without those secrets it deploys to GitHub Pages as before (used during the move).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.target.outputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Choose host
        id: target
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then echo "target=cloudflare" >> "$GITHUB_OUTPUT"; echo "Deploying to Cloudflare Pages";
          else echo "target=github" >> "$GITHUB_OUTPUT"; echo "::notice::No Cloudflare secrets yet: deploying to GitHub Pages (CLOUDFLARE.md)"; fi
      - run: npm ci
      - run: npm run validate-data
      - name: Type check
        run: npx tsc --noEmit
      - name: Build website + game
        run: BASE_PATH_ROOT="" SITE_URL="${SITE_URL:-https://cozyacres.joshmakesgames.app}" bash scripts/pages/build.sh
        env:
          SITE_URL: ${{ vars.SITE_URL || '' }}
          # Real online play (see ONLINE.md). Set these as repository variables (or secrets) under
          # Settings > Secrets and variables > Actions. When empty the game uses practice mode.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL || '' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || '' }}
          # Phone notifications (ONLINE.md, "Notifications"): the public VAPID key. Empty = notifications off.
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY || secrets.VITE_VAPID_PUBLIC_KEY || '' }}
          # Android app link (.well-known/assetlinks.json), only written when both are set. Repository
          # variables: the app id (e.g. app.joshmakesgames.cozyacres) and the SHA-256 signing certificate
          # fingerprint(s) from Play Console > App integrity (comma separated).
          ANDROID_PACKAGE: ${{ vars.ANDROID_PACKAGE || '' }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 || '' }}
      - name: List site
        run: ls -la dist dist/play && (ls -la dist/.well-known 2>/dev/null || echo "no .well-known (no Android fingerprint set)")
      # creates the Pages project on the first run; fails harmlessly once it exists
      - name: Create Cloudflare Pages project (first run only)
        if: steps.target.outputs.target == 'cloudflare'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'cozy-acres' }} --production-branch=main
      - name: Deploy to Cloudflare Pages
        if: steps.target.outputs.target == 'cloudflare'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'cozy-acres' }} --branch=main --commit-dirty=true
      # GitHub Pages (until the Cloudflare secrets are set). v3 archives dist with `tar ... --exclude=.git
      # --exclude=.github .`, so dot folders such as .well-known and the .nojekyll file are included.
      - if: steps.target.outputs.target == 'github'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-github-pages:
    needs: build
    if: needs.build.outputs.target == 'github'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
